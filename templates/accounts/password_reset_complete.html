{% extends "base.html" %}

{% block title %}Password Reset Complete - Subscript{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm mt-4 text-center">
            <div class="card-body p-4">
                <div class="mb-3 text-success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0m-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                </div>
                <h3 class="card-title mb-3">Password Updated</h3>
                <p class="text-muted mb-4">
                    Your password has been successfully updated. You can now sign in using your new credentials.
                </p>
                <div class="d-grid">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
