{% extends "base.html" %}

{% block title %}Server Error (500) - Subscript{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-secondary fw-bold">500</div>
        <h2 class="h4 mb-3">Internal Server Error</h2>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request.
            Our technical team has been notified.
        </p>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
